name: Deploy to Prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment zip
        run: zip -r deploy.zip app static requirements.txt startup.sh

      - name: Deploy to Azure Web App (Prod)
        uses: azure/webapps-deploy@v3
        timeout-minutes: 20
        with:
          app-name: hyperxen-pricing-bot-db5hmngq3woxa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: deploy.zip

      - name: Sync startup.sh, write deploy marker, restart app
        run: |
          CREDS=$(python3 -c "
          import xml.etree.ElementTree as ET, os
          root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
          p = next(x for x in root.findall('publishProfile') if 'MSDeploy' in x.get('publishMethod',''))
          print(p.get('userName') + ':' + p.get('userPWD'))
          ")
          curl -sf -X PUT "https://hyperxen-pricing-bot-db5hmngq3woxa.scm.azurewebsites.net/api/vfs/site/startup.sh" \
            -u "${CREDS}" -H "If-Match: *" --data-binary @startup.sh
          echo "startup.sh synced"
          curl -sf -X PUT "https://hyperxen-pricing-bot-db5hmngq3woxa.scm.azurewebsites.net/api/vfs/site/wwwroot/.deploy_id" \
            -u "${CREDS}" -H "If-Match: *" --data-binary "$(date +%s)"
          echo ".deploy_id written to wwwroot — startup.sh will sync app/ and static/ on next restart"
          curl -sf -X DELETE "https://hyperxen-pricing-bot-db5hmngq3woxa.scm.azurewebsites.net/api/processes/0" \
            -u "${CREDS}" || true
          echo "app process restarted"
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}

      - name: Smoke test — bulk pricing upload
        run: |
          BASE_URL="https://tools.hyperxen.ai"
          FIXTURE="tests/fixtures/bulk_pricing_smoke_test.xlsx"

          # Wait for old gunicorn to fully die. DELETE /processes/0 is async — the
          # old process may still serve requests for several seconds after the API
          # returns. Without this sleep, attempt 1 of the health check can hit the
          # old process (still alive) and give a false "app ready" signal.
          echo "Waiting 20s for process restart to propagate..."
          sleep 20

          # Poll /api/bulk-pricing/template until new gunicorn is up (max 20 × 10s = 200s).
          echo "Polling for app readiness..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/api/bulk-pricing/template" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "App ready (attempt $i)"
              break
            fi
            echo "  attempt $i: HTTP $STATUS — retrying in 10s"
            if [ "$i" = "20" ]; then
              echo "ERROR: app did not come up after 200s"
              exit 1
            fi
            sleep 10
          done

          # POST the two-row fixture — exercises _price_row, _pick_sku_cached,
          # search_skus (AI Search), and sql_license_hourly (sql_pricing module).
          HTTP_CODE=$(curl -s -o /tmp/smoke_response.json -w "%{http_code}" \
            -X POST "${BASE_URL}/api/bulk-pricing/upload" \
            -F "file=@${FIXTURE}" 2>/dev/null)

          echo "POST /api/bulk-pricing/upload → HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SMOKE TEST FAILED: expected HTTP 200, got $HTTP_CODE"
            echo "--- response body ---"
            cat /tmp/smoke_response.json
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/smoke_response.json') as f:
              data = json.load(f)
          rows   = data.get('rows', [])
          totals = data.get('totals', {})
          total  = totals.get('monthly_total', 0)
          sql_t  = totals.get('monthly_sql', 0)
          warns  = data.get('warnings', [])
          print(f"  rows priced : {len(rows)}/2")
          print(f"  grand total : ${total:.2f}/mo")
          print(f"  SQL total   : ${sql_t:.2f}/mo  (expected ~$23.36 for Web SQL row)")
          print(f"  warnings    : {warns}")
          errors = []
          if len(rows) != 2:
              errors.append(f"expected 2 rows priced, got {len(rows)} — row(s) failed silently (check warnings)")
          if warns:
              errors.append(f"pricing warnings present — rows failed: {warns}")
          if sql_t <= 0:
              errors.append(f"monthly_sql={sql_t} — expected >0; row 2 has Web SQL (~$23.36/mo) — sql_pricing import failure?")
          if total <= 0:
              errors.append(f"monthly_total={total} — expected > 0")
          if errors:
              for e in errors:
                  print(f"SMOKE TEST FAILED: {e}")
              sys.exit(1)
          print("SMOKE TEST PASSED")
          PYEOF
